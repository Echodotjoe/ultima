<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Dashboard</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-color: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #ff4757;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 250px;
            background-color: var(--panel-color);
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            padding: 20px 10px;
            box-sizing: border-box;
        }
        #sidebar h2 {
            margin-top: 0;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
        }
        .game-btn {
            background: none;
            border: none;
            color: #aaa;
            text-align: left;
            padding: 12px 15px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 6px;
            margin-bottom: 5px;
            transition: all 0.2s ease;
        }
        .game-btn:hover {
            background-color: #2a2a2a;
            color: #fff;
        }
        .game-btn.active {
            background-color: var(--accent-color);
            color: #fff;
            font-weight: bold;
        }
        #content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #000;
            position: relative;
        }
        .game-view {
            width: 100%;
            height: 100%;
            border: none;
        }
        #no-game {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #555;
            font-size: 1.5rem;
        }
        .controls-overlay {
            position: absolute;
            bottom: 10px;
            right: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
            pointer-events: auto;
            z-index: 10;
        }
        .save-indicator {
            background: rgba(0,0,0,0.85);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #00ff00;
            border: 1px solid #333;
        }
        .save-disabled {
            color: #ff4757;
        }
        .fullscreen-btn {
            background-color: #2f3542;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .fullscreen-btn:hover {
            background-color: var(--accent-color);
        }
    </style>
    <!-- Dynamic CDN load of the Ruffle Flash Player framework -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

    <div id="sidebar">
        <h2>My Games</h2>
        <div id="game-list"></div>
    </div>

    <div id="content-area">
        <div id="no-game">Select a game to start playing</div>
        <!-- Dynamic target element where games are generated and destroyed -->
        <div id="runtime-container" style="width:100%; height:100%;"></div>
        
        <!-- Controls UI Container -->
        <div id="controls-panel" class="controls-overlay" style="display: none;">
            <div id="status-tag" class="save-indicator"></div>
            <button id="fs-toggle" class="fullscreen-btn">🖥️ Fullscreen</button>
        </div>
    </div>

    <script>
        // =========================================================================
        // CONFIGURATION: Add your folder paths or direct external URLs here!
        // - Web links starting with http:// or https:// embed automatically.
        // - Folders default to launching HTML5 (looking for folder/index.html).
        // - Strings ending explicitly in ".swf" launch Ruffle directly.
        // - Append an asterisk (*) to turn off persistent browser canvas saving.
        // =========================================================================
        const GAMES = [
            "geodash",                 // Local Folder -> HTML5 game
            "super-mario*",            // Local Folder -> HTML5 game, saving disabled
            "binding-of-isaac/game.swf",// Local Path -> Direct SWF
            "https://site.io",         // External Website Link (Embedded)
            "https://poki.com*",       // External Website Link, saving disabled indicator
        ];

        // ==========================================
        // CORE ENGINE LOGIC
        // ==========================================
        const gameListContainer = document.getElementById('game-list');
        const runtimeContainer = document.getElementById('runtime-container');
        const noGamePlaceholder = document.getElementById('no-game');
        const controlsPanel = document.getElementById('controls-panel');
        const statusTag = document.getElementById('status-tag');
        const fsToggle = document.getElementById('fs-toggle');
        
        let activeElementRef = null;

        // Configure Global Ruffle settings
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            "autoplay": "on",
            "unmuteOverlay": "hidden",
            "letterbox": "on"
        };

        GAMES.forEach(gameEntry => {
            const cleanName = gameEntry.trim();
            const isSaveDisabled = cleanName.endsWith('*');
            let targetPath = isSaveDisabled ? cleanName.slice(0, -1).trim() : cleanName;
            
            // Check if it's an external web link or local file asset type
            const isWebLink = targetPath.startsWith('http://') || targetPath.startsWith('https://');
            const isSwf = !isWebLink && targetPath.toLowerCase().endsWith('.swf');
            
            // Format nice display name for the navigation sidebar buttons
            let displayName = targetPath;
            if (isWebLink) {
                displayName = targetPath.replace(/https?:\/\/(www\.)?/, '').split('/');
            } else {
                displayName = targetPath.split('/').pop().replace('.swf', '');
            }
            displayName = displayName.replace(/[-_]/g, ' ');

            const button = document.createElement('button');
            button.className = 'game-btn';
            button.textContent = displayName; 
            
            button.onclick = () => {
                document.querySelectorAll('.game-btn').forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                noGamePlaceholder.style.display = 'none';
                controlsPanel.style.display = 'flex';

                // PURGE PREVIOUS GAME FROM RAM COMPLETELY
                if (activeElementRef) {
                    if (typeof activeElementRef.remove === 'function') {
                        activeElementRef.remove();
                    }
                    runtimeContainer.innerHTML = '';
                    activeElementRef = null;
                }

                // INITIALIZE FRESH GAME ELEMENT FROM SCRATCH
                if (isSwf) {
                    const ruffle = window.RufflePlayer.newest();
                    activeElementRef = ruffle.createPlayer();
                    activeElementRef.className = "game-view";
                    runtimeContainer.appendChild(activeElementRef);
                    activeElementRef.load(targetPath);
                } else {
                    activeElementRef = document.createElement('iframe');
                    activeElementRef.className = "game-view";
                    
                    if (isWebLink) {
                        activeElementRef.src = targetPath;
                    } else {
                        activeElementRef.src = `./${targetPath}/index.html`;
                    }
                    
                    if (isSaveDisabled) {
                        activeElementRef.removeAttribute('sandbox');
                    } else {
                        activeElementRef.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-modals allow-pointer-lock');
                    }
                    runtimeContainer.appendChild(activeElementRef);
                }

                // Handle system UI text updates
                if (isSaveDisabled) {
                    statusTag.textContent = "💾 Saving: DISABLED";
                    statusTag.className = "save-indicator save-disabled";
                } else {
                    statusTag.textContent = "💾 Saving: ENABLED (Persistent)";
                    statusTag.className = "save-indicator";
                    initPersistentStorage(displayName.replace(/\s+/g, '_'));
                }
            };

            gameListContainer.appendChild(button);
        });

        // Trigger native Fullscreen mode targeting the generated game window directly
        fsToggle.onclick = () => {
            if (activeElementRef) {
                if (activeElementRef.requestFullscreen) {
                    activeElementRef.requestFullscreen();
                } else if (activeElementRef.webkitRequestFullscreen) {
                    activeElementRef.webkitRequestFullscreen();
                }
            }
        };

        // File system persistent background storage initialization helper
async function initPersistentStorage(gameId) {
try {
if (navigator.storage && navigator.storage.getDirectory) {
const root = await navigator.storage.getDirectory();
await root.getDirectoryHandle(gameId, { create: true });
}
} catch (err) {
console.warn("Storage profile initialized with fallback constraints.", err);
}
}
